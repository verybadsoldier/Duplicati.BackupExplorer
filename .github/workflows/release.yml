name: Release Duplicati BackupExplorer
run-name: Creating Release on GitHub

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_and_release:
    strategy:
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: win
            os: windows-latest
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Display dotnet version
        run: dotnet --version

      - name: Run Tests
        run: dotnet test

      # --- Build Step (OS-dependent output path) ---
      - name: Publish Application
        run: |
          if [[ "${{ matrix.target }}" == "win" ]]; then
            dotnet publish -c Release --os win -o "release_files" Duplicati.BackupExplorer/Duplicati.BackupExplorer.csproj
          else
            dotnet publish -c Release --os linux -o "build_linux" Duplicati.BackupExplorer/Duplicati.BackupExplorer.csproj
          fi
        shell: bash

      # --- Linux Packaging ---
      - name: Package Linux Release
        if: matrix.target == 'linux'
        run: |
          cd build_linux
          zip -r "../Duplicati-BackupExplorer-linux-${{ github.ref_name }}.zip" *
          echo "ASSET_PATH=Duplicati-BackupExplorer-linux-${{ github.ref_name }}.zip" >> $GITHUB_ENV
        shell: bash
      
      # --- Windows Packaging & Installer Creation ---
      - name: Package Windows ZIP Release
        if: matrix.target == 'win'
        run: Compress-Archive -Path release_files\* -DestinationPath "Duplicati.BackupExplorer-win-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Install Inno Setup (Chocolatey)
        if: matrix.target == 'win'
        run: choco install innosetup -y
        shell: pwsh
      - name: Compile Inno Installer (direct ISCC)
        if: matrix.target == 'win'
        run: |
          # pick the version string from the workflow (e.g. "v1.0.0")
          $ver = '${{ github.ref_name }}'
          # strip surrounding quotes (if any), and optionally strip leading "v"
          $ver = $ver.Trim('"')
          Write-Host "Using AppVersion: $ver"
        
          # find iscc.exe
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Path
          if (-not $iscc) {
            # default location (Inno Setup 6 typical)
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
        
          if (-not (Test-Path $iscc)) {
            Write-Error "iscc.exe not found at $iscc"
            exit 1
          }
        
          & $iscc "/DAppVersion=$ver" "$env:GITHUB_WORKSPACE\installer.iss"
        shell: pwsh
      - name: Set Windows Asset Paths
        if: matrix.target == 'win'
        run: echo "ASSET_PATH=Duplicati.BackupExplorer-win-${{ github.ref_name }}.zip,InstallerOutput/Duplicati.BackupExplorer-win-Setup-${{ github.ref_name }}.exe" >> $GITHUB_ENV
        shell: bash

      # --- Create Release and Upload Assets ---
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          # Tagged pushes create a full release; manual runs create a pre-release for testing.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # This action is smart enough to find the existing release created
          # by the other job in the matrix and append files to it.
          files: ${{ env.ASSET_PATH }}

